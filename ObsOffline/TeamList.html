<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Team Info</title>
  <link rel="stylesheet" href="TeamList.css">

  <script src="gsap-minified/gsap.min.js"></script>
  <script src="gsap-minified/CustomEase.min.js"></script>
  <script src="gsap-minified/SplitText.min.js"></script>
  <!-- https://gsap.com/docs/v3/Installation/?tab=cdn&module=esm&require=false&ease=CustomEase if you want online imports -->
</head>
<body>
<div class="content-box-600x220">
  <p id="team" class="team">Team</p>
  <p id="name" class="name">Name</p>
</div>
<script>
  document.addEventListener("DOMContentLoaded", (event) => {
    gsap.registerPlugin(SplitText, CustomEase)
  });

  let teams = [];
  let index = 0;

  async function fetchTeams() {
    const response = await fetch('TeamList.json');
    teams = await response.json();
    animateAndUpdate();
    setInterval(animateAndUpdate, 4000);
  }

  function animateAndUpdate() {
    if (teams.length === 0) return;

    const team = teams[index % teams.length];

    let split = SplitText.create([".team", ".name"], { type: "words, chars" });
    gsap.to(split.chars, {
      y: -20,
      opacity: 0,
      duration: 0.75,
      ease: CustomEase.create("custom", "M0,0 C1,1 0,1 1,1 "),
      stagger: 0.05,
      onComplete: () => {
        document.getElementById('name').innerText = team.name;
        document.getElementById('team').innerText = team.team;

        index++;

        // Animate IN
        let split = SplitText.create([".team", ".name"], { type: "words, chars" });
        gsap.fromTo(split.chars,
                { y: 20, opacity: 0 },
                { y: 0, opacity: 1, duration: 0.5, stagger: 0.05, ease: "back.out" }
        );
      }
    });
  }

  document.addEventListener("DOMContentLoaded", fetchTeams);
</script>
